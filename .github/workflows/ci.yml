name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832bf12 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit + adversarial tests + adapter E2E (mock pi, no LLM needed)
      - run: npm run check
      # The shipped example spec must validate
      - run: node --import tsx tests/example-spec-check.ts
